name: Feature request
description: Suggest a scoped improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, private citizen data, or vulnerability details. Security reports belong in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Keep the proposal grounded in the current prototype.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment or files
      description: Mention affected routes, components, docs, or workflows.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety and sensitive information
      options:
        - label: I removed secrets, credentials, tokens, private citizen data, and production-only values.
          required: true
        - label: This request does not claim official sensor, medical, flood, or public-safety authority without evidence.
          required: true
